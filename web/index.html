<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>intj</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="picker" hidden>
      <div id="picker-box">
        <section id="pick-folder">
          <h2>Choose a project folder</h2>
          <div id="dir-path"></div>
          <ul id="dir-list"></ul>
          <button id="dir-choose">Use this folder</button>
        </section>
        <section id="pick-workload" hidden>
          <h2>Choose a workload</h2>
          <div id="workload-project"></div>
          <button id="workload-new">New workload</button>
          <ul id="workload-list"></ul>
          <div id="workload-config">
            <div id="picker-agent">
              <label for="picker-agent-cmd">Agent command</label>
              <input id="picker-agent-cmd" placeholder="claude" autocomplete="off" spellcheck="false" />
            </div>
            <div id="picker-sparse">
              <div class="picker-sparse-head">
                <label>Sparse directories</label>
                <button id="sparse-add" type="button" title="Add a directory">+</button>
              </div>
              <div id="sparse-list"></div>
            </div>
            <button id="workload-open">Open workload</button>
          </div>
        </section>
      </div>
    </div>
    <div id="app" hidden>
      <section id="doc">
        <header class="bar">
          <span id="doc-name"></span>
          <span class="spacer"></span>
          <button id="doc-up" hidden>Back</button>
        </header>
        <div id="doc-scroll">
          <div id="doc-body">
            <article id="preview"></article>
            <aside id="gutter"></aside>
          </div>
        </div>
      </section>
      <div id="divider"></div>
      <section id="panel">
        <header class="bar dark">
          <span id="panel-title">terminal</span>
          <span class="spacer"></span>
          <button id="panel-close" hidden>Back to main</button>
        </header>
        <div id="terms"></div>
      </section>
    </div>
    <div id="popup" hidden>
      <input id="popup-input" placeholder="What should Claude do?" autocomplete="off" />
      <button id="popup-start">Start chat</button>
      <button id="popup-fork" title="Then click a comment on the right to continue from its files and conversation">Fork chat</button>
      <button id="popup-split" title="Shorten the selected module here and move its detail into a linked child doc">Split doc</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
