<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>intj</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <section id="tree">
        <header class="bar">
          <span id="tree-title">目录</span>
          <span class="spacer"></span>
          <button id="tree-toggle" title="折叠">«</button>
        </header>
        <nav id="tree-list"></nav>
      </section>
      <section id="doc">
        <header class="bar">
          <span id="doc-name"></span>
          <span class="spacer"></span>
          <button id="doc-up" hidden>Back</button>
        </header>
        <div id="doc-scroll">
          <div id="doc-body">
            <article id="preview"></article>
            <aside id="gutter"></aside>
          </div>
        </div>
      </section>
      <div id="divider"></div>
      <section id="panel">
        <header class="bar dark">
          <span id="panel-title">terminal</span>
          <span class="spacer"></span>
          <button id="panel-close" hidden>回到主干</button>
        </header>
        <div id="terms"></div>
      </section>
    </div>
    <div id="popup" hidden>
      <input id="popup-input" placeholder="要 Claude 做什么？" autocomplete="off" />
      <button id="popup-start">Start chat</button>
      <button id="popup-split" title="把选中的模块在当前文档里缩成简介，详细内容移到链接的子文档">Split doc</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
